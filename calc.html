<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: sans-serif;
    }
    .calculator {
      background-color: #333;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    .display {
      background-color: #cfcfcf;
      color: #000;
      text-align: right;
      padding: 10px;
      font-size: 2em;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      gap: 10px;
    }
    button {
      padding: 20px;
      font-size: 1.2em;
      border: none;
      border-radius: 5px;
      background-color: #fff;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #ddd;
    }
    .equal {
      background-color: orange;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="calculator">
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>÷</button>

    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>×</button>

    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>−</button>

    <button>0</button>
    <button>.</button>
    <button>+</button>
    <button class="equal">=</button>
  </div>
</div>

</body>
</html>
